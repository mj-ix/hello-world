[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aipet"
version = "0.1.0"
description = "An autonomous AI pet that makes music and art, runs simulations, invents hobbies, writes letters, and runs its own little shop."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
claude = ["anthropic>=2.0"]
dev = ["pytest>=8", "anthropic>=2.0"]

[project.scripts]
aipet = "aipet.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["aipet*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
